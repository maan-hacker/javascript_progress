<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart.js Practice</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Line Chart with two lines  -->
    <!-- In datasets array each object represents a line -->

    

    <div>
        <canvas id="myChart"></canvas>
    </div>


    <div id="inputs">
        <input type="text" id="skill" placeholder="Enter The skill"><br/>
        <input type="number" id="score" placeholder="Enter the score" min="0" max="100"><br/>
        <button id="btn">Add Skill</button>
    </div>


    <script src="script.js"></script>
</body>
</html>
